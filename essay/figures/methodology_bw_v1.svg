<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040">
<title>Methodology: component forecasting, horizon-specific ensembles, and spatial residual correction</title>
<desc>Black-and-white structure draft. Two parallel tree-model sources form a horizon-specific base forecast. A graph attention model predicts a residual correction, while a skip connection preserves the base forecast. Three lower panels explain the component structure, target-time alignment and tail gating, and spatial residual correction.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="black"/></marker></defs>
<rect width="1800" height="1040" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="black">
<text x="30" y="38" font-size="23" font-weight="bold" text-anchor="start">FORECASTING FRAMEWORK</text>
<rect x="30" y="145" width="215" height="145" fill="white" stroke="black" stroke-width="1.5"/>
<text x="137.5" y="181.62" font-size="18" font-weight="normal" text-anchor="middle">Shared inputs</text>
<text x="137.5" y="209.62" font-size="18" font-weight="normal" text-anchor="middle">72h outage history</text>
<text x="137.5" y="237.62" font-size="18" font-weight="normal" text-anchor="middle">216h weather</text>
<text x="137.5" y="265.62" font-size="18" font-weight="normal" text-anchor="middle">County attributes</text>
<path d="M 245,218 L 272,218 L 272,153 L 300,153" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 272,218 L 272,286 L 300,286" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300" y="120" width="250" height="85" fill="white" stroke="black" stroke-width="1.5"/>
<text x="425" y="145" font-size="19" font-weight="normal" text-anchor="middle">① Enhanced</text>
<text x="425" y="169" font-size="19" font-weight="normal" text-anchor="middle">component models</text>
<text x="425" y="193" font-size="13" font-weight="normal" text-anchor="middle">+ selected neighbor features</text>
<rect x="300" y="253" width="250" height="66" fill="white" stroke="black" stroke-width="1.5"/>
<text x="425.0" y="279.96" font-size="19" font-weight="normal" text-anchor="middle">Long-horizon</text>
<text x="425.0" y="304.96" font-size="19" font-weight="normal" text-anchor="middle">prediction sources</text>
<path d="M 550,153 L 615,153" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 550,286 L 615,286" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="615" y="117" width="350" height="215" fill="white" stroke="black" stroke-width="1.5"/>
<text x="790" y="149" font-size="20" font-weight="bold" text-anchor="middle">② Align and combine</text>
<text x="790" y="191" font-size="18" font-weight="normal" text-anchor="middle">1h / 6h: aligned T₁ / T₆</text>
<text x="790" y="232" font-size="18" font-weight="normal" text-anchor="middle">24h: H[(T₂₄ + S₂₄) / 2]</text>
<text x="790" y="273" font-size="18" font-weight="normal" text-anchor="middle">48h: S₄₈</text>
<text x="790" y="310" font-size="16" font-weight="normal" text-anchor="middle">Horizon-specific base forecast</text>
<path d="M 965,199 L 1045,199" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 1005,199 L 1005,77 L 1415,77 L 1415,181" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1210" y="65" font-size="17" font-weight="normal" text-anchor="middle">Base forecast (skip connection)</text>
<rect x="1045" y="162" width="210" height="74" fill="white" stroke="black" stroke-width="1.5"/>
<text x="1150.0" y="192.46" font-size="19" font-weight="normal" text-anchor="middle">③ GAT</text>
<text x="1150.0" y="218.46" font-size="19" font-weight="normal" text-anchor="middle">residual model</text>
<rect x="1030" y="280" width="240" height="64" fill="white" stroke="black" stroke-width="1.5"/>
<text x="1150.0" y="305.78" font-size="17" font-weight="normal" text-anchor="middle">Node features</text>
<text x="1150.0" y="329.78" font-size="17" font-weight="normal" text-anchor="middle">+ geographic graph</text>
<path d="M 1150,280 L 1150,236" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 1255,199 L 1397,199" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1326" y="180" font-size="21" font-weight="normal" text-anchor="middle">αₕ r̂ₕ</text>
<circle cx="1415" cy="199" r="18" fill="white" stroke="black" stroke-width="1.4"/>
<text x="1415" y="207" font-size="25" font-weight="normal" text-anchor="middle">+</text>
<path d="M 1433,199 L 1480,199" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1480" y="151" width="290" height="96" fill="white" stroke="black" stroke-width="1.5"/>
<text x="1625.0" y="179.46" font-size="19" font-weight="normal" text-anchor="middle">Postprocess H</text>
<text x="1625.0" y="205.46" font-size="19" font-weight="normal" text-anchor="middle">Final OSI forecasts</text>
<text x="1625.0" y="231.46" font-size="19" font-weight="normal" text-anchor="middle">1h · 6h · 24h · 48h</text>
<text x="1480" y="303" font-size="15.5" font-weight="normal" text-anchor="start">H: clip to [0, 0.65];</text>
<text x="1480" y="327" font-size="15.5" font-weight="normal" text-anchor="start">set values &lt; 0.001 to zero</text>
<path d="M 30,385 L 1770,385" fill="none" stroke="black" stroke-width="1"/>
<rect x="30" y="425" width="520" height="585" fill="white" stroke="black" stroke-width="1.5"/>
<text x="50" y="463" font-size="22" font-weight="bold" text-anchor="start">① Component structure</text>
<text x="50" y="501" font-size="17" font-weight="normal" text-anchor="start">LightGBM models for P, N, D, R</text>
<rect x="55" y="529" width="470" height="142" fill="white" stroke="black" stroke-width="1.5"/>
<text x="290" y="560" font-size="18" font-weight="bold" text-anchor="middle">Initial-state reconstruction: P₁, P₆</text>
<rect x="73" y="590" width="95" height="47" fill="white" stroke="black" stroke-width="1.5"/>
<text x="120.5" y="619.62" font-size="18" font-weight="normal" text-anchor="middle">p = P₇₁</text>
<path d="M 168,613 L 196,613" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="353" y="602" font-size="16" font-weight="normal" text-anchor="middle">Predict normalized branches a and b</text>
<text x="353" y="637" font-size="22" font-weight="normal" text-anchor="middle">P̂ = p â + (1 − p) b̂</text>
<rect x="55" y="694" width="470" height="114" fill="white" stroke="black" stroke-width="1.5"/>
<text x="290" y="725" font-size="18" font-weight="bold" text-anchor="middle">Known-history reconstruction: D₁</text>
<text x="290" y="761" font-size="19" font-weight="normal" text-anchor="middle">Known contribution K + predicted U</text>
<text x="290" y="791" font-size="16" font-weight="normal" text-anchor="middle">Use when K &gt; 0 (target hours 73–76)</text>
<rect x="55" y="832" width="470" height="62" fill="white" stroke="black" stroke-width="1.5"/>
<text x="290.0" y="856.62" font-size="18" font-weight="normal" text-anchor="middle">Other component sources:</text>
<text x="290.0" y="881.62" font-size="18" font-weight="normal" text-anchor="middle">direct regression</text>
<text x="290" y="939" font-size="18" font-weight="bold" text-anchor="middle">Recombine predicted components</text>
<text x="290" y="973" font-size="17" font-weight="normal" text-anchor="middle">OSI = max(0, .40P + .35N + .25D − .10R)</text>
<rect x="570" y="425" width="650" height="585" fill="white" stroke="black" stroke-width="1.5"/>
<text x="590" y="463" font-size="22" font-weight="bold" text-anchor="start">② Time alignment and tail gating</text>
<text x="590" y="507" font-size="18" font-weight="bold" text-anchor="start">Short horizons: align the target hour</text>
<rect x="598" y="536" width="220" height="43" fill="white" stroke="black" stroke-width="1.5"/>
<text x="708.0" y="563.62" font-size="18" font-weight="normal" text-anchor="middle">Origin 119 + 1h</text>
<rect x="598" y="604" width="220" height="43" fill="white" stroke="black" stroke-width="1.5"/>
<text x="708.0" y="631.62" font-size="18" font-weight="normal" text-anchor="middle">Origin 114 + 6h</text>
<rect x="899" y="552" width="290" height="78" fill="white" stroke="black" stroke-width="1.5"/>
<text x="1044.0" y="583.78" font-size="17" font-weight="normal" text-anchor="middle">Same target hour 120</text>
<text x="1044.0" y="609.78" font-size="17" font-weight="normal" text-anchor="middle">Average component forecasts</text>
<path d="M 818,557 L 858,557 L 858,577 L 899,577" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 818,626 L 871,626 L 871,608 L 899,608" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="895" y="677" font-size="16" font-weight="normal" text-anchor="middle">Other eligible horizons join the same average.</text>
<text x="895" y="712" font-size="19" font-weight="normal" text-anchor="middle">Aligned components → OSI → T₁, T₆</text>
<path d="M 590,737 L 1200,737" fill="none" stroke="black" stroke-width="1"/>
<text x="590" y="773" font-size="18" font-weight="bold" text-anchor="start">Long horizons: 24h and 48h</text>
<rect x="590" y="795" width="258" height="109" fill="white" stroke="black" stroke-width="1.5"/>
<text x="719.0" y="828.43" font-size="14.5" font-weight="normal" text-anchor="middle">LightGBM / XGBoost / CatBoost</text>
<text x="719.0" y="854.43" font-size="14.5" font-weight="normal" text-anchor="middle">Direct OSI + direct components</text>
<text x="719.0" y="880.43" font-size="14.5" font-weight="normal" text-anchor="middle">6 processed forecasts</text>
<path d="M 848,850 L 889,850" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="889" y="795" width="306" height="109" fill="white" stroke="black" stroke-width="1.5"/>
<text x="1042.0" y="819.11" font-size="16.5" font-weight="normal" text-anchor="middle">Tail gate</text>
<text x="1042.0" y="843.11" font-size="16.5" font-weight="normal" text-anchor="middle">B &gt; θ: reference B</text>
<text x="1042.0" y="867.11" font-size="16.5" font-weight="normal" text-anchor="middle">Otherwise: six-source mean</text>
<text x="1042.0" y="891.11" font-size="16.5" font-weight="normal" text-anchor="middle">Output S₂₄, S₄₈</text>
<text x="590" y="936" font-size="15.5" font-weight="normal" text-anchor="start">B: original LightGBM component forecast</text>
<text x="590" y="963" font-size="15.5" font-weight="normal" text-anchor="start">θ: inner positive-prediction 95th percentile</text>
<text x="590" y="989" font-size="15.5" font-weight="normal" text-anchor="start">T₂₄: enhanced components, without time alignment</text>
<rect x="1240" y="425" width="530" height="585" fill="white" stroke="black" stroke-width="1.5"/>
<text x="1260" y="463" font-size="22" font-weight="bold" text-anchor="start">③ Spatial residual correction</text>
<text x="1332" y="513" font-size="16" font-weight="normal" text-anchor="middle">County graph</text>
