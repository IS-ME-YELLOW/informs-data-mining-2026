<rect x="1415" y="540" width="326" height="94" fill="white" stroke="black" stroke-width="1.5"/>
<text x="1578.0" y="568.12" font-size="18" font-weight="normal" text-anchor="middle">Base forecast</text>
<text x="1578.0" y="593.12" font-size="18" font-weight="normal" text-anchor="middle">+ node features</text>
<text x="1578.0" y="618.12" font-size="18" font-weight="normal" text-anchor="middle">+ geographic context</text>
<path d="M 1323,642 L 1323,688" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 1578,634 L 1578,688" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1270" y="688" width="470" height="64" fill="white" stroke="black" stroke-width="1.5"/>
<text x="1505.0" y="713.46" font-size="19" font-weight="normal" text-anchor="middle">GAT residual model</text>
<text x="1505.0" y="739.46" font-size="19" font-weight="normal" text-anchor="middle">One model per horizon</text>
<path d="M 1505,752 L 1505,796" fill="none" stroke="black" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1364" y="796" width="282" height="52" fill="white" stroke="black" stroke-width="1.5"/>
<text x="1505.0" y="828.46" font-size="19" font-weight="normal" text-anchor="middle">α × predicted residual</text>
<text x="1505" y="884" font-size="19" font-weight="normal" text-anchor="middle">Final OSI = H(base + α × residual)</text>
<rect x="1270" y="927" width="470" height="66" fill="white" stroke="black" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="1505" y="952" font-size="16" font-weight="normal" text-anchor="middle">Training only: r = y − cross-fitted base</text>
<text x="1505" y="978" font-size="16" font-weight="normal" text-anchor="middle">Choose α using inner county-level CV</text>
</g></svg>